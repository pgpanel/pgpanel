# PgPanel production stack
# Panel image is pre-built (GHCR). VPS does NOT compile Rust/frontend by default.
# PostgreSQL clusters are created dynamically by the panel — not listed here.
# Backups: native engine inside the panel (no Databasus service).
#
# SECURITY: panel mounts Docker socket (host-root equivalent). See SECURITY.md.

name: pgpanel

networks:
  pgpanel_frontend:
    name: pgpanel_frontend
    driver: bridge
  pgpanel_internal:
    name: pgpanel_internal
    driver: bridge
    internal: false
  pgpanel_database_management:
    name: pgpanel_database_management
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PGPANEL_DOMAIN: ${PGPANEL_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pgpanel_frontend
    depends_on:
      - panel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /config/caddy

  panel:
    # Pre-built only — installer never builds on the VPS.
    image: ${PGPANEL_IMAGE:-ghcr.io/pgpanel/pgpanel:0.1.0}
    # The installer pulls the panel image explicitly before startup.
    # pull_policy=missing keeps a temporary registry outage from blocking restarts.
    pull_policy: ${PGPANEL_PULL_POLICY:-missing}
    restart: unless-stopped
    # Keep cutover short — SQLite cannot be shared by two panels, so we stop
    # the old instance quickly and bring the new one up (near-zero downtime).
    stop_grace_period: 3s
    env_file:
      - ../.env
    environment:
      PGPANEL_BIND: 0.0.0.0:8080
      PGPANEL_DATA_DIR: /var/lib/pgpanel
      PGPANEL_STATIC_DIR: /app/static
      PGPANEL_DATABASE_URL: sqlite:///var/lib/pgpanel/panel.db?mode=rwc
      DOCKER_HOST: unix:///var/run/docker.sock
      PGPANEL_MANAGEMENT_NETWORK: ${PGPANEL_MANAGEMENT_NETWORK:-pgpanel_database_management}
      PGPANEL_BACKUP_DIR: /var/lib/pgpanel/backups
      BACKUP_STORAGE_TYPE: ${BACKUP_STORAGE_TYPE:-local}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_COUNT: ${BACKUP_MAX_COUNT:-30}
      BACKUP_ENCRYPT: ${BACKUP_ENCRYPT:-1}
    volumes:
      - ${PGPANEL_HOST_DATA:-/var/lib/pgpanel}/panel:/var/lib/pgpanel
      # HIGH RISK — Docker socket for cluster provisioning + pg_dump exec only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pgpanel_frontend
      - pgpanel_internal
      - pgpanel_database_management
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
