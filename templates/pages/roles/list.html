{% extends "layouts/app.html" %}{% block content %}
<div class="flex justify-between mb-4"><h2 class="text-lg font-medium">Roles · {{ cluster }}</h2><a href="/roles/{{ version }}/{{ cluster }}/create?port={{ port }}" class="px-3 py-1.5 bg-teal-600 text-white rounded-lg text-sm">Create role</a></div>
<table class="w-full text-sm bg-white dark:bg-zinc-900 rounded-xl border"><thead class="bg-slate-50 dark:bg-zinc-800"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">Login</th><th class="p-3 text-left">Superuser</th></tr></thead><tbody>{% for r in roles %}<tr class="border-t"><td class="p-3"><a href="/roles/{{ version }}/{{ cluster }}/{{ r.name }}?port={{ port }}">{{ r.name }}</a></td><td class="p-3">{{ r.can_login }}</td><td class="p-3">{{ r.is_superuser }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
