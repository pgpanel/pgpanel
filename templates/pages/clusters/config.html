{% extends "layouts/app.html" %}
{% block content %}
<p class="text-sm text-slate-500 mb-4">Config: <code class="font-mono">{{ config_path }}</code></p>
<div class="bg-white dark:bg-zinc-900 rounded-xl border overflow-hidden mb-4"><table class="w-full text-sm"><thead><tr class="bg-slate-50 dark:bg-zinc-800"><th class="text-left p-3">Setting</th><th class="text-left p-3">Value</th></tr></thead><tbody>{% for s in settings %}<tr class="border-t"><td class="p-3 font-mono">{{ s.key }}</td><td class="p-3 font-mono">{{ s.value }}</td></tr>{% endfor %}</tbody></table></div>
<form method="post" action="/clusters/{{ version }}/{{ name }}/config" class="max-w-lg bg-white dark:bg-zinc-900 rounded-xl border p-4 space-y-3">
  <input type="hidden" name="csrf_token" value="{{ ctx.csrf_token }}">
  <input name="key" placeholder="setting_name" required class="w-full px-3 py-2 border rounded-lg"><input name="value" placeholder="value" required class="w-full px-3 py-2 border rounded-lg">
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="allow_restart" value="1"> Allow restart if needed</label>
  <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-lg">Update setting</button>
</form>
{% endblock %}
