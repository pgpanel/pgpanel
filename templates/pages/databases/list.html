{% extends "layouts/app.html" %}{% block content %}
<div class="flex justify-between mb-4"><h2 class="text-lg font-medium">Databases · {{ cluster }}</h2><a href="/databases/{{ version }}/{{ cluster }}/create?port={{ port }}" class="px-3 py-1.5 bg-teal-600 text-white rounded-lg text-sm">Create</a></div>
<table class="w-full text-sm bg-white dark:bg-zinc-900 rounded-xl border"><thead class="bg-slate-50 dark:bg-zinc-800"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">Owner</th><th class="p-3 text-left">Size</th></tr></thead><tbody>{% for d in databases %}<tr class="border-t"><td class="p-3"><a href="/databases/{{ version }}/{{ cluster }}/{{ d.name }}?port={{ port }}" class="text-teal-600">{{ d.name }}</a></td><td class="p-3">{{ d.owner }}</td><td class="p-3">{{ d.size_bytes }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
