{% extends "layouts/auth.html" %}
{% block content %}
<form method="post" action="/auth/reauth" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="return_to" value="{{ return_to }}">
  <div><label class="block text-sm font-medium mb-1">Password</label><input name="password" type="password" required class="w-full px-3 py-2 rounded-lg border dark:border-zinc-700"></div>
  <div><label class="block text-sm font-medium mb-1">TOTP code</label><input name="totp_code" type="text" class="w-full px-3 py-2 rounded-lg border dark:border-zinc-700"></div>
  <button type="submit" class="w-full py-2.5 rounded-lg bg-teal-600 text-white font-medium">Confirm</button>
</form>
{% endblock %}
