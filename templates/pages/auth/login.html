{% extends "layouts/auth.html" %}
{% block content %}
{% if let Some(err) = error %}<div class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm">{{ err }}</div>{% endif %}
<form method="post" action="/auth/login" class="space-y-4">
  <div><label class="block text-sm font-medium mb-1">Username</label><input name="username" type="text" required class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-800"></div>
  <div><label class="block text-sm font-medium mb-1">Password</label><input name="password" type="password" required class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-800"></div>
  <div><label class="block text-sm font-medium mb-1">TOTP (if enabled)</label><input name="totp_code" type="text" inputmode="numeric" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-800"></div>
  <button type="submit" class="w-full py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-medium">Sign in</button>
</form>
{% endblock %}
