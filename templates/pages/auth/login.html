{% extends "layouts/auth.html" %}
{% block content %}
{% if let Some(err) = error %}<div class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm dark:bg-red-900/20 dark:text-red-300">{{ err }}</div>{% endif %}
<form method="post" action="/auth/login" class="space-y-5">
  <div><label class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">Username</label><input name="username" type="text" required autofocus class="input-field w-full px-3 py-2 rounded-lg border"></div>
  <div><label class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">Password</label><input name="password" type="password" required class="input-field w-full px-3 py-2 rounded-lg border"></div>
  <div><label class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">TOTP <span class="font-normal text-slate-400">(if enabled)</span></label><input name="totp_code" type="text" inputmode="numeric" class="input-field w-full px-3 py-2 rounded-lg border"></div>
  <button type="submit" class="btn-primary w-full py-2.5 rounded-lg">Sign in</button>
</form>
{% endblock %}
