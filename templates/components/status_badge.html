<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
  {% if status == "online" || status == "running" || status == "success" %}bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300
  {% else %}{% if status == "down" || status == "stopped" || status == "failure" %}bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300
  {% else %}bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300{% endif %}{% endif %}">{{ status }}</span>
