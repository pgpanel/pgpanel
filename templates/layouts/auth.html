{% extends "layouts/base.html" %}
{% block body %}
<div class="min-h-full flex items-center justify-center p-6" x-data="{ theme: $store.theme }">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-teal-600 text-white mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
      </div>
      <h1 class="text-2xl font-semibold">{{ ctx.title }}</h1>
      <p class="text-slate-500 dark:text-zinc-400 mt-1">PostgreSQL cluster management</p>
    </div>
    <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-lg border border-slate-200 dark:border-zinc-800 p-6">
      {% block content %}{% endblock %}
    </div>
    <p class="text-center text-xs text-slate-400 mt-6">PgPanel · Secure by default</p>
  </div>
</div>
{% endblock %}
