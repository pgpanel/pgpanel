{% extends "layouts/base.html" %}
{% block body %}
<div class="min-h-full flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-teal-600 text-white mb-5 shadow-lg shadow-teal-600/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">PgPanel</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">{{ ctx.title }}</p>
    </div>
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 p-6 sm:p-8">
      {% block content %}{% endblock %}
    </div>
    <p class="text-center text-xs text-slate-400 mt-6">PostgreSQL cluster management · Secure by default</p>
  </div>
</div>
{% endblock %}
