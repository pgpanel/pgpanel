<!DOCTYPE html>
<html lang="en" class="h-full" x-data="pgpanelApp()" x-init="init()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ ctx.title }}{% endblock %} · PgPanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v={{ ctx.asset_v }}">
  <script src="/static/js/app.js?v={{ ctx.asset_v }}" defer></script>
  <script src="/static/js/htmx.min.js?v={{ ctx.asset_v }}" defer></script>
  <!-- Alpine CDN build requires CSP unsafe-eval for inline x-data/x-on expressions -->
  <script defer src="/static/js/alpine.min.js?v={{ ctx.asset_v }}"></script>
</head>
<body class="h-full font-sans">
  {% block body %}{% endblock %}
  <div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-50 flex flex-col gap-2" aria-live="polite"></div>
</body>
</html>
