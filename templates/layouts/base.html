<!DOCTYPE html>
<html lang="en" class="h-full" x-data="pgpanelApp()" x-init="init()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ ctx.title }}{% endblock %} · PgPanel</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
  <!-- Alpine CDN build requires CSP unsafe-eval for inline x-data/x-on expressions -->
  <script defer src="/static/js/alpine.min.js"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  {% block body %}{% endblock %}
  <div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-50 flex flex-col gap-2" aria-live="polite"></div>
</body>
</html>
